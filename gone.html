<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title> . </title>
    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
        }

        body {
            display: grid;
            place-items: center;
            background: #050505;
            color: #d8d8d8;
            font-family: "Times New Roman", serif;
            text-align: center;
            padding: 24px;
        }

        .message {
            max-width: 700px;
            font-size: clamp(22px, 3vw, 36px);
            line-height: 1.3;
            opacity: 0;
            animation: goneTextFadeIn 10s ease 2s forwards;
        }

        @keyframes goneTextFadeIn {
            0% {
                opacity: 0;
                filter: blur(6px);
                transform: translateY(10px);
            }

            100% {
                opacity: 1;
                filter: blur(0);
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="message">He awaits your move</div>
    <img src="Assests/Art/King Chess.webp" alt="King chess" style="display:block; margin-top:-500px; max-width:100px; width:min(60vw, 240px); height:center;" />
</body>
</html>
